<script>
    let students = [];

    const defaultStudentPhoto = 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=80';

    const studentTagExplanations = {
        Tunagrahita: 'Tunagrahita adalah kondisi yang berkaitan dengan kemampuan intelektual yang lebih terbatas dibandingkan teman seusianya. Pembelajaran di sekolah disesuaikan dengan kebutuhan, kecepatan, dan karakteristik belajar masing-masing siswa.',
        Tunarungu: 'Tunarungu adalah kondisi gangguan pendengaran yang memengaruhi kemampuan menerima informasi suara. Pembelajaran di sekolah dilakukan dengan pendekatan visual, komunikasi yang jelas, dan dukungan media pendukung agar siswa tetap dapat belajar dengan optimal.',
        Tunadaksa: 'Tunadaksa adalah kondisi yang berkaitan dengan keterbatasan fisik atau mobilitas, seperti gangguan pada anggota tubuh yang dapat memengaruhi kegiatan sehari-hari. Siswa dengan tunadaksa memerlukan dukungan dalam akses belajar, penggunaan alat bantu, serta penyesuaian lingkungan agar tetap dapat belajar dan berkembang secara optimal.',
        Downsyndrome: 'Down syndrome adalah kondisi genetik yang umumnya terjadi karena adanya salinan ekstra kromosom 21. Anak dengan Down syndrome dapat membutuhkan dukungan dalam perkembangan motorik, bahasa, komunikasi, pembelajaran, dan kemandirian. Di sekolah, pembelajaran dapat disesuaikan dengan kebutuhan dan kemampuan setiap siswa melalui pendekatan yang individual, terstruktur, dan penuh perhatian, sehingga mereka dapat mengembangkan potensi dan kemandiriannya secara optimal.',
        ADHD: 'ADHD adalah kondisi yang memengaruhi fokus, perhatian, serta kontrol impulsif. Siswa dengan kebutuhan ini memerlukan strategi pembelajaran yang terstruktur, konsisten, dan disesuaikan dengan kebutuhan konsentrasi mereka.',
        Autis: 'Autis adalah kondisi perkembangan yang memengaruhi komunikasi, interaksi sosial, dan respons terhadap lingkungan. Pembelajaran dilakukan secara personal, terstruktur, dan sesuai dengan kebutuhan siswa agar proses belajar menjadi lebih efektif.',
        default: 'Siswa dengan fokus pada bidang tertentu mendapatkan pembelajaran yang disesuaikan dengan kebutuhan, potensi, dan perkembangan individu agar dapat tumbuh secara optimal.'
    };

    const normalizeStudentTag = (value = '') => (value || '').toLowerCase().replace(/[^a-z]/g, '');
    const normalizeLevelValue = (value = '') => (value || '').toString().trim().toUpperCase().replace(/\s+/g, '');

    const getStudentPhoto = (student) => student.photo || defaultStudentPhoto;

    const getStudentExplanation = (student) => {
        const tag = (student.tag || '').trim();
        const normalizedTag = normalizeStudentTag(tag);
        const matchedKey = Object.keys(studentTagExplanations).find(
            key => normalizeStudentTag(key) === normalizedTag
        );

        if (matchedKey) {
            return studentTagExplanations[matchedKey];
        }

        return studentTagExplanations.default.replace(
            'bidang tertentu',
            `bidang ${tag ? tag.toLowerCase() : 'belajar'}`
        );
    };

    const parseCsvLine = (line) => {
        const values = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i += 1) {
            const char = line[i];

            if (char === '"') {
                if (inQuotes && line[i + 1] === '"') {
                    current += '"';
                    i += 1;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                values.push(current.trim());
                current = '';
            } else {
                current += char;
            }
        }

        values.push(current.trim());
        return values;
    };

    const normalizeCsvStudent = (row) => {
        const level = normalizeLevelValue(row.level);
        const tag = (row.tag || '').trim();
        const levelColors = {
            TKLB: 'linear-gradient(135deg, var(--slb-primary) 0%, var(--slb-secondary) 100%)',
            SDLB: 'linear-gradient(135deg, var(--slb-secondary) 0%, var(--slb-highlight) 100%)',
            SMPLB: 'linear-gradient(135deg, rgba(11,79,156,0.92) 0%, rgba(96,165,250,0.74) 100%)',
            SMALB: 'linear-gradient(135deg, var(--slb-deep) 0%, var(--slb-primary) 100%)'
        };

        return {
            name: (row.name || '').trim(),
            level,
            kelas: (row.kelas || '').trim(),
            tag,
            nisn: (row.nisn || '').trim(),
            tanggalLahir: (row.tanggalLahir || '').trim(),
            bio: (row.bio || '').trim() || 'Aktif dan semangat belajar.',
            photo: (row.photo || '').trim(),
            color: levelColors[level] || 'linear-gradient(135deg, var(--slb-primary) 0%, var(--slb-secondary) 100%)'
        };
    };

    const loadStudentsFromCsv = async () => {
        try {
            const response = await fetch('../../assets/data/students_2026_2027_filtered.csv');
            const text = await response.text();
            const rows = text.split(/\r?\n/).filter(Boolean);

            if (!rows.length) return;

            const headers = parseCsvLine(rows[0]);
            const parsedRows = rows.slice(1).map((line) => {
                const values = parseCsvLine(line);
                const row = {};

                headers.forEach((header, index) => {
                    row[header] = values[index] ?? '';
                });

                return row;
            }).filter((row) => (row.name || '').trim());

            students = parsedRows.map(normalizeCsvStudent);
            students.forEach((student) => {
                student.nisn = student.nisn ?? '';
                student.tanggalLahir = student.tanggalLahir ?? '';
                student.photo = student.photo || defaultStudentPhoto;
            });
            populateNeedFilterOptions();
            renderStudents();
        } catch (error) {
            console.error('Gagal memuat data siswa:', error);
            renderStudents();
        }
    };

    students.forEach((student) => {
        student.nisn = student.nisn ?? '';
        student.tanggalLahir = student.tanggalLahir ?? '';
        student.photo = student.photo || defaultStudentPhoto;
    });

    const levelOrder = ['TKLB', 'SDLB', 'SMPLB', 'SMALB'];
    const grid = document.getElementById('student-grid');
    const loadMoreBtn = document.getElementById('load-more');
    const levelFilter = document.getElementById('level-filter');
    const needFilter = document.getElementById('need-filter');
    const studentTotalCount = document.getElementById('student-total-count');
    const profileModal = document.getElementById('student-profile-modal');
    const profileContent = document.getElementById('student-profile-content');
    const closeProfileButton = document.getElementById('close-student-modal');

    let currentLevelFilter = 'all';
    let currentNeedFilter = 'all';
    let visibleCount = 8;

    const getInitials = (name = '') => {
        const parts = (name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return '?';

        const initials = parts.slice(0, 3).map(part => part.charAt(0)).join('').toUpperCase();
        return initials;
    };

    const getNeedFilterOptions = () => {
        const preferredOrder = ['Tunagrahita', 'Tunarungu', 'Tunadaksa', 'Down syndrome', 'ADHD', 'Autis'];
        const uniqueTags = [...new Set(students
            .map(student => (student.tag || '').trim())
            .filter(Boolean)
        )];

        const orderedTags = preferredOrder.filter((tag) =>
            uniqueTags.some((studentTag) => normalizeStudentTag(studentTag) === normalizeStudentTag(tag))
        );

        return [...new Set([...orderedTags, ...uniqueTags])];
    };

    const populateNeedFilterOptions = () => {
        const options = getNeedFilterOptions();
        needFilter.innerHTML = [
            '<option value="all">Semua kebutuhan khusus</option>',
            ...options.map((tag) => `<option value="${tag}">${tag}</option>`)
        ].join('');

        if (options.some((tag) => normalizeStudentTag(tag) === normalizeStudentTag(currentNeedFilter)) || currentNeedFilter === 'all') {
            needFilter.value = currentNeedFilter;
        } else {
            currentNeedFilter = 'all';
            needFilter.value = 'all';
        }
    };

    const getFilteredStudents = () => {
        let filteredStudents = [...students];

        if (currentLevelFilter !== 'all') {
            filteredStudents = filteredStudents.filter(student =>
                normalizeLevelValue(student.level) === normalizeLevelValue(currentLevelFilter)
            );
        }

        if (currentNeedFilter !== 'all') {
            filteredStudents = filteredStudents.filter(student =>
                normalizeStudentTag(student.tag) === normalizeStudentTag(currentNeedFilter)
            );
        }

        return filteredStudents;
    };

    function openStudentProfile(studentIndex) {
        const student = students[studentIndex];
        if (!student) return;

        const nisn = (student.nisn || '').trim() || 'Belum diisi';
        const tanggalLahir = (student.tanggalLahir || '').trim() || 'Belum diisi';

        profileContent.innerHTML = `
            <div class="space-y-6">
                <div class="rounded-3xl border border-slate-200 bg-slate-50 p-4 sm:p-5">
                    <div class="grid gap-5 sm:grid-cols-[150px_1fr] sm:items-center">
                        <div class="relative h-36 w-full overflow-hidden rounded-3xl border border-slate-200 bg-slate-100 shadow-inner">
                            <img src="${getStudentPhoto(student)}" alt="${student.name}" class="h-full w-full object-cover" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-avatar').style.display='flex';" />
                            <div class="fallback-avatar hidden h-full w-full items-center justify-center bg-gradient-to-br ${student.color} text-4xl font-black text-white">
                                ${getInitials(student.name)}
                            </div>
                        </div>

                        <div>
                            <div class="mb-3 flex flex-wrap gap-2">
                                <span class="rounded-full bg-[#e8f1ff] px-2.5 py-1 text-[11px] font-semibold text-[#0b4f9c]">${student.level}</span>
                                <span class="rounded-full border border-slate-200 bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-600">${student.kelas || 'Kelas belum diisi'}</span>
                                <span class="rounded-full border border-slate-200 bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-600">${student.tag}</span>
                            </div>
                            <h3 class="text-3xl font-black leading-tight tracking-[-0.04em] text-slate-900">${student.name}</h3>
                        </div>
                    </div>
                </div>

                <div class="grid gap-4 sm:grid-cols-2">
                    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                        <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-500">NISN</p>
                        <p class="mt-2 text-base font-semibold text-slate-800">${nisn}</p>
                    </div>
                    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                        <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-500">Tanggal lahir</p>
                        <p class="mt-2 text-base font-semibold text-slate-800">${tanggalLahir}</p>
                    </div>
                </div>

                <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                    <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-[#0b4f9c]">Penjelasan singkat</p>
                    <p class="mt-3 text-base leading-8 text-slate-600">
                        ${getStudentExplanation(student)}
                    </p>
                </div>
            </div>
        `;

        profileModal.classList.remove('hidden');
        profileModal.classList.add('flex');
    }

    function closeStudentProfile() {
        profileModal.classList.add('hidden');
        profileModal.classList.remove('flex');
    }

    function renderStudents() {
        const filteredStudents = getFilteredStudents();
        const itemsToRender = filteredStudents.slice(0, visibleCount);

        if (studentTotalCount) {
            studentTotalCount.textContent = filteredStudents.length;
        }

        grid.innerHTML = itemsToRender.map((student, index) => {
            const studentIndex = students.indexOf(student);

            return `
                <article class="student-card student-card--editorial">
                    <div class="student-card__media">
                        <div class="student-card__media-frame" style="background: ${student.color};">
                            <div class="student-card__avatar" style="background: transparent;">
                                ${getInitials(student.name)}
                            </div>
                        </div>
                    </div>

                    <div class="student-card__body">
                        <div class="student-card__topline">
                            <div class="student-card__meta">
                                <span class="student-card__badge">${student.level}</span>
                                <span class="student-card__chip">${student.kelas || 'Kelas belum diisi'}</span>
                            </div>
                            <span class="student-card__tag">${student.tag}</span>
                        </div>

                        <div class="mb-3">
                            <h3 class="student-card__name">${student.name}</h3>
                        </div>

                        <p class="student-card__text">${student.bio}</p>

                        <div class="student-card__footer">
                            <span class="student-card__subtle">Profil</span>
                            <button type="button" class="student-detail-btn student-card__cta" data-index="${studentIndex}">
                                Lihat
                            </button>
                        </div>
                    </div>
                </article>
            `;
        }).join('');

        const hasMore = filteredStudents.length > visibleCount;
        loadMoreBtn.style.display = filteredStudents.length > 8 ? 'inline-flex' : 'none';
        loadMoreBtn.textContent = hasMore ? 'Tampilkan lebih banyak' : 'Tampilkan lebih sedikit';
    }

    levelFilter.addEventListener('change', (event) => {
        currentLevelFilter = event.target.value;
        visibleCount = 8;
        renderStudents();
    });

    needFilter.addEventListener('change', (event) => {
        currentNeedFilter = event.target.value;
        visibleCount = 8;
        renderStudents();
    });

    document.addEventListener('click', (event) => {
        const trigger = event.target.closest('.student-detail-btn');
        if (!trigger) return;

        const studentIndex = Number(trigger.dataset.index);
        openStudentProfile(studentIndex);
    });

    closeProfileButton.addEventListener('click', closeStudentProfile);

    profileModal.addEventListener('click', (event) => {
        if (event.target === profileModal) {
            closeStudentProfile();
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !profileModal.classList.contains('hidden')) {
            closeStudentProfile();
        }
    });

    loadMoreBtn.addEventListener('click', () => {
        const filteredStudents = getFilteredStudents();

        if (visibleCount >= filteredStudents.length) {
            visibleCount = 8;
        } else {
            visibleCount = Math.min(visibleCount + 8, filteredStudents.length);
        }

        renderStudents();
    });

    loadStudentsFromCsv();
</script>
</body>
</html>
