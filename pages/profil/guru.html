<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="tentang SLB YAPMI, profil SLB Rancaekek, visi misi SLB YAPMI, sekolah luar biasa Kabupaten Bandung">

    <meta property="og:description" content="SLB YAPMI Rancaekek adalah sekolah luar biasa swasta di Rancaekek, Kabupaten Bandung, yang berkomitmen pada pendidikan inklusif dan pengembangan kemandirian peserta didik.">

    <meta property="og:url" content="https://www.slbyapmi.com/pages/profil/sekolah.html">

    <title>Tentang SLB YAPMI Rancaekek | Profil Sekolah</title>
    <link
        rel="shortcut icon"
        href="../../assets/images/slb-logo.png"
        type="image/x-icon"
    >

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        html,
        body,
        main,
        section,
        div,
        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        span,
        small,
        strong,
        a,
        li,
        button {
            font-family: "Lexend", "Segoe UI", sans-serif;
        }

        main {
            position: relative;
            background: var(--section-light);
            overflow: hidden;
        }

        main::before,
        main::after {
            content: "";
            position: absolute;
            width: 560px;
            height: 560px;
            border-radius: 50%;
            background: rgba(11, 79, 156, 0.04);
            filter: blur(38px);
            pointer-events: none;
            z-index: 0;
        }

        main::before {
            top: -180px;
            left: -120px;
        }

        main::after {
            right: -160px;
            bottom: -220px;
        }

        #profil-guru-title {
            position: relative;
            z-index: 1;
            background: var(--section-light);
            border-top: 1px solid rgba(11, 79, 156, 0.04);
            padding-bottom: 2rem;
        }

        .staff-section {
            position: relative;
            z-index: 1;
            padding: 3.5rem 1.25rem;
            background: var(--section-light);
            border-top: 1px solid rgba(11, 79, 156, 0.04);
            border-bottom: 1px solid rgba(11, 79, 156, 0.04);
        }

        .staff-section__wrapper {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
        }

        .staff-section__wrapper::before {
            content: "";
            position: absolute;
            inset: -0.85rem 8% auto 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(11, 79, 156, 0.18) 12%, rgba(11, 79, 156, 0.18) 88%, transparent 100%);
            pointer-events: none;
        }

        .staff-gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.4rem;
        }

        .staff-gallery--lead {
            grid-template-columns: 1fr;
            justify-items: center;
        }

        .staff-gallery--lead .staff-item {
            width: min(100%, 680px);
            max-width: 680px;
        }

        .staff-section--secondary {
            padding-top: 1rem;
        }

        .staff-item {
            position: relative;
            width: 100%;
            min-height: 220px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1.3rem;
            padding: 1rem 1.1rem 1rem 1.3rem;
            border-radius: 1.15rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(234,242,251,0.72));
            background-color: var(--section-soft);
            border: 1.5px solid rgba(11, 79, 156, 0.12);
            box-shadow: 0 12px 20px rgba(11, 79, 156, 0.07);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .staff-photo {
            width: 112px;
            height: 112px;
            margin-left: 0.28rem;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(11, 79, 156, 0.05), rgba(35, 128, 216, 0.03));
            border: 2px solid rgba(11, 79, 156, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--slb-primary);
            flex-shrink: 0;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .staff-item:hover .staff-photo {
            border-color: rgba(11, 79, 156, 0.26);
            box-shadow: 0 8px 18px rgba(11, 79, 156, 0.08);
            transform: translateY(-1px);
        }

        .staff-photo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .staff-photo i {
            width: 48px;
            height: 48px;
            stroke-width: 1.4;
            opacity: 0.35;
        }

        .staff-identity {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.2rem 0.1rem 0.15rem 0;
            text-align: left;
        }

        .staff-role {
            margin: 0;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--slb-primary);
            line-height: 1.4;
            opacity: 0.96;
        }

        .staff-name {
            margin: 0;
            font-size: 1.28rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.04em;
            color: #19314d;
            overflow-wrap: anywhere;
        }

        .staff-meta {
            display: grid;
            gap: 0.4rem;
            margin-top: 0.05rem;
            align-items: start;
        }

        .staff-meta span {
            display: grid;
            grid-template-columns: 78px 12px minmax(0, 1fr);
            align-items: center;
            gap: 0.35rem;
            color: var(--slb-text);
            font-size: 0.8rem;
            line-height: 1.55;
            min-height: 1.9em;
        }

        .staff-meta strong {
            display: inline-block;
            width: 78px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--slb-primary);
            line-height: 1.55;
            white-space: nowrap;
            text-align: left;
            padding-top: 0;
        }

        .staff-meta em {
            display: inline-block;
            width: 12px;
            font-style: normal;
            color: var(--slb-primary);
            font-weight: 700;
            text-align: center;
            line-height: 1.55;
            margin-left: 0;
            justify-self: center;
            padding-top: 0;
        }

        .staff-item:hover {
            border-color: rgba(11, 79, 156, 0.18);
            box-shadow: 0 10px 18px rgba(11, 79, 156, 0.045);
            transform: translateY(-1px);
        }

        @media (max-width: 900px) {
            .staff-gallery {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .staff-section {
                padding: 2.5rem 1.25rem;
            }

            .staff-item {
                min-height: 180px;
                gap: 0.8rem;
            }

            .staff-photo {
                width: 96px;
                height: 96px;
            }

            .staff-photo i {
                width: 42px;
                height: 42px;
            }
        }

        @media (max-width: 480px) {
            .staff-item {
                padding: 0.75rem;
                gap: 0.7rem;
            }

            .staff-photo {
                width: 76px;
                height: 76px;
            }

            .staff-role {
                font-size: 0.58rem;
                letter-spacing: 0.08em;
            }

            .staff-name {
                font-size: 0.9rem;
                line-height: 1.35;
            }

            .staff-meta {
                gap: 0.25rem;
            }

            .staff-meta span {
                grid-template-columns: 50px 10px minmax(0, 1fr);
                gap: 0.22rem;
                font-size: 0.6rem;
                line-height: 1.45;
            }

            .staff-meta strong {
                width: 50px;
                font-size: 0.56rem;
            }

            .staff-meta em {
                width: 10px;
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800">

<div id="site-navbar"></div>

<main>
    <section id="profil-guru-title" class="bg-section-light pt-10 pb-5 sm:pt-10 sm:pb-3">
        <div class="mx-auto max-w-6xl px-5 sm:px-8">
            <div class="reveal text-center">
                <p class="text-xs font-semibold uppercase tracking-[.18em] text-[#0b4f9c]">
                    Profil Guru dan Tenaga Pendidik
                </p>
                <h1 class="mt-3 text-3xl font-bold leading-tight tracking-tight text-slate-900 sm:text-4xl lg:text-[2rem]">
                    Mari Kenali Guru dan Tenaga Pendidik Kami
                </h1>
            </div>
        </div>
    </section>

    <section class="staff-section reveal">
        <div class="staff-section__wrapper">
            <div id="staff-lead-gallery" class="staff-gallery staff-gallery--lead"></div>
        </div>
    </section>

    <section class="staff-section staff-section--secondary reveal">
        <div class="staff-section__wrapper">
            <div id="staff-grid" class="staff-gallery"></div>
        </div>
    </section>
</main>

<div id="site-footer"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const leadGallery = document.getElementById("staff-lead-gallery");
        const staffGrid = document.getElementById("staff-grid");

        const cleanText = function (value) {
            return (value ?? "").toString().replace(/\s+/g, " ").trim();
        };

        const getSiteRoot = function () {
            const currentPath = window.location.pathname || "/";
            const nestedIndexes = [
                currentPath.indexOf("/pages/"),
                currentPath.indexOf("/system/")
            ].filter(function (index) {
                return index !== -1;
            });

            if (nestedIndexes.length > 0) {
                const firstNestedIndex = Math.min.apply(null, nestedIndexes);

                if (firstNestedIndex === 0) {
                    return "/";
                }

                return currentPath.slice(0, firstNestedIndex) + "/";
            }

            return currentPath.endsWith("/")
                ? currentPath
                : currentPath.replace(/\/[^/]*$/, "/");
        };

        const formatLabel = function (value) {
            const text = cleanText(value);

            if (!text) {
                return "Belum diisi";
            }

            return text
                .replace(/\s+/g, " ")
                .replace(/\b\w/g, function (char) {
                    return char.toUpperCase();
                });
        };

        const formatNip = function (value) {
            const text = cleanText(value);

            if (!text) {
                return "Belum diisi";
            }

            const digitsOnly = text.replace(/\D/g, "");

            if (!digitsOnly) {
                return "Belum diisi";
            }

            if (digitsOnly.length >= 14) {
                return [
                    digitsOnly.slice(0, 3),
                    digitsOnly.slice(3, 7),
                    digitsOnly.slice(7, 9),
                    digitsOnly.slice(9, 11),
                    digitsOnly.slice(11, 14)
                ].join(".");
            }

            return digitsOnly;
        };

        const defaultStaffPhoto = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Default staff avatar">
                <rect width="160" height="160" fill="#edf4ff"/>
                <circle cx="80" cy="54" r="28" fill="#cbd5e1"/>
                <path d="M46 122c8-18 22-28 34-28s26 10 34 28" fill="#cbd5e1"/>
                <circle cx="80" cy="50" r="30" fill="#dfeafc" stroke="#93a7c4" stroke-width="2"/>
                <circle cx="80" cy="54" r="16" fill="#9aa8bb"/>
                <path d="M46 122c9-18 23-28 34-28s25 10 34 28" fill="#9aa8bb"/>
            </svg>
        `)}`;

        const getInitials = function (value) {
            const parts = (value || "").trim().split(/\s+/).filter(Boolean);
            if (!parts.length) {
                return "?";
            }

            return parts.slice(0, 3).map(function (part) {
                return part.charAt(0);
            }).join("").toUpperCase();
        };

        const getStaffPhoto = function (staff) {
            const photo = (staff.photo || staff.PHOTO || "").trim();
            return photo || defaultStaffPhoto;
        };

        const parseCsvLine = function (line) {
            const values = [];
            let current = "";
            let inQuotes = false;

            for (let index = 0; index < line.length; index += 1) {
                const char = line[index];

                if (char === '"') {
                    if (inQuotes && line[index + 1] === '"') {
                        current += '"';
                        index += 1;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === "," && !inQuotes) {
                    values.push(current.trim());
                    current = "";
                } else {
                    current += char;
                }
            }

            values.push(current.trim());
            return values;
        };

        const normalizeCsvStaff = function (row) {
            return {
                ...row,
                NAMA: (row.NAMA || row.nama || "").trim(),
                JABATAN: (row.JABATAN || row.jabatan || "").trim(),
                PENDIDIKAN: (row.PENDIDIKAN || row.pendidikan || "").trim(),
                NIP: (row.NIP || row.nip || "").trim(),
                photo: (row.photo || row.PHOTO || "").trim()
            };
        };

        const buildStaffCard = function (staff) {
            const staffName = formatLabel(staff.NAMA || staff.name || "");
            const photoUrl = getStaffPhoto(staff);

            return `
                <div class="staff-item">
                    <div class="staff-photo relative overflow-hidden">
                        <img src="${photoUrl}" alt="${staffName}" class="h-full w-full object-cover" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-avatar').style.display='flex';" />
                        <div class="fallback-avatar hidden h-full w-full items-center justify-center bg-gradient-to-br from-[#dfeafc] to-[#bcd7ff] text-xl font-black text-[#0b4f9c]">${getInitials(staffName)}</div>
                    </div>
                    <div class="staff-identity">
                        <p class="staff-role">${formatLabel(staff.JABATAN)}</p>
                        <h3 class="staff-name">${staffName}</h3>
                        <div class="staff-meta">
                            <span><strong>NIP</strong><em>:</em> ${formatNip(staff.NIP)}</span>
                            <span><strong>Jabatan</strong><em>:</em> ${formatLabel(staff.JABATAN)}</span>
                            <span><strong>Pendidikan</strong><em>:</em> ${formatLabel(staff.PENDIDIKAN)}</span>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderStaffData = function (records) {
            const validRecords = records.filter(function (row) {
                return cleanText(row.NAMA) && cleanText(row.JABATAN);
            });

            if (!validRecords.length) {
                if (leadGallery) {
                    leadGallery.innerHTML = `
                        <div class="staff-item">
                            <div class="staff-photo"><i data-lucide="alert-circle"></i></div>
                            <div class="staff-identity">
                                <p class="staff-role">Informasi</p>
                                <h3 class="staff-name">Data guru belum tersedia</h3>
                                <div class="staff-meta">
                                    <span><strong>Status</strong><em>:</em> Menunggu pembaruan data</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (staffGrid) {
                    staffGrid.innerHTML = "";
                }

                if (window.lucide) {
                    lucide.createIcons();
                }

                return;
            }

            const leadStaff = validRecords[0];
            const additionalStaff = validRecords.slice(1);

            if (leadGallery) {
                leadGallery.innerHTML = buildStaffCard(leadStaff);
            }

            if (staffGrid) {
                staffGrid.innerHTML = additionalStaff.map(buildStaffCard).join("");
            }

            if (window.lucide) {
                lucide.createIcons();
            }
        };

        const siteRoot = getSiteRoot();
        const staffCsvUrl = new URL("assets/data/daftar_guru_dan_tendik.csv?v=" + Date.now(), window.location.origin + siteRoot).href;

        fetch(staffCsvUrl, { cache: "no-store" })
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("CSV guru tidak ditemukan");
                }

                return response.text();
            })
            .then(function (csvText) {
                const rows = csvText.split(/\r?\n/).filter(function (line) {
                    return line.trim();
                });

                if (!rows.length) {
                    renderStaffData([]);
                    return;
                }

                const headers = parseCsvLine(rows[0]);
                const parsedRows = rows.slice(1).map(function (line) {
                    const values = parseCsvLine(line);
                    const row = {};

                    headers.forEach(function (header, index) {
                        row[header] = values[index] ?? "";
                    });

                    return normalizeCsvStaff(row);
                });

                renderStaffData(parsedRows);
            })
            .catch(function (error) {
                console.error("Gagal memuat data guru:", error);
                renderStaffData([]);
            });
    });
</script>
<script src="../../assets/js/script.js"></script>
</body>
</html>
