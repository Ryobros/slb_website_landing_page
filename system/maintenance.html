<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLB YAPMI — Maintenance</title>
    <style>
        :root {
            --bg-1: #edf6ff;
            --bg-2: #dfeeff;
            --primary: #0b4f9c;
            --primary-strong: #083d7a;
            --primary-soft: #e2f0ff;
            --text: #0f172a;
            --muted: #475569;
            --card: rgba(255, 255, 255, 0.88);
            --border: rgba(11, 79, 156, 0.14);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(96,165,250,0.18), transparent 24%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .page-shell {
            width: min(980px, 100%);
            min-height: min(640px, calc(100vh - 48px));
            display: grid;
            place-items: center;
            position: relative;
        }

        .page-shell::before {
            content: "";
            position: absolute;
            inset: 28px 26px;
            background-image:
                linear-gradient(rgba(11,79,156,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(11,79,156,0.04) 1px, transparent 1px);
            background-size: 26px 26px;
            border-radius: 32px;
            mask-image: radial-gradient(circle at center, black 44%, transparent 100%);
        }

        .card {
            position: relative;
            width: min(980px, 100%);
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid rgba(11, 79, 156, 0.10);
            box-shadow: 0 30px 70px rgba(11, 79, 156, 0.12);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(96,165,250,0.08), transparent 38%, rgba(11,79,156,0.04));
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            inset: 0 auto 0 0;
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(11,79,156,0.8), transparent);
            animation: scan 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes scan {
            0% { transform: translateY(-120%); }
            100% { transform: translateY(700%); }
        }

        .maintenance-wrap {
            position: relative;
            display: grid;
            grid-template-columns: 160px 1fr;
            align-items: center;
            gap: 28px;
            padding: 42px 46px;
        }

        .icon-box {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 32px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(11,79,156,0.09), rgba(96,165,250,0.14));
            border: 1px solid rgba(11,79,156,0.14);
            margin-inline: auto;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8);
            overflow: hidden;
        }

        .lottie-wrap {
            width: 138px;
            height: 138px;
            display: grid;
            place-items: center;
        }

        .lottie-wrap svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .brand {
            display: inline-block;
            margin: 0;
            font-size: 0.72rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
        }

        .pill {
            display: inline-block;
            margin-top: 18px;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: var(--primary-soft);
            border:1px solid rgba(11,79,156,0.12);
            color: var(--primary);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 700;
        }

        h1 {
            margin: 20px 0 0;
            font-size: clamp(2rem, 3vw, 3.4rem);
            line-height: 1.08;
            letter-spacing: -0.06em;
            font-weight: 800;
        }

        h1 span {
            color: var(--primary);
        }

        p {
            margin: 16px 0 0;
            max-width: 610px;
            font-size: 1.04rem;
            line-height: 1.8;
            color: var(--muted);
        }

        .actions {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .primary,
        .secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0.82rem 1.3rem;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: white;
            box-shadow: 0 10px 22px rgba(11,79,156,0.18);
        }

        .secondary {
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(15,23,42,0.08);
            color: var(--text);
        }

        .primary:hover,
        .secondary:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 760px) {
            .maintenance-wrap {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 30px 22px 34px;
                text-align: center;
            }

            .lottie-wrap {
                order: 1;
                width: 110px;
                height: 110px;
                margin: 0 auto;
                display: grid;
                place-items: center;
            }

            .content {
                order: 2;
            }

            .icon-box {
                width: 124px;
                height: 124px;
            }

            .actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="card">
            <div class="maintenance-wrap">
                <div id="lottie-maintenance" class="lottie-wrap"></div>

                <div class="content">
                    <div class="pill">Maintenance</div>

                    <h1>
                        <span class="block">Oops!!</span>
                    </h1>

                    <p>
                        Our rabbit is working on it. We'll be back shortly! 
                    </p>

                    <div class="actions">
                        <a href="../index.html" class="primary">Go Back to Homepage</a>
                        <a href="../pages/kontak.html" class="secondary">Contact Admin</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            if (window.lottie && document.getElementById('lottie-maintenance')) {
                lottie.loadAnimation({
                    container: document.getElementById('lottie-maintenance'),
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    path: '../assets/lottie/Davsan.json'
                });
            }
        });
    </script>
</body>
</html>
