<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLB YAPMI — Page Not Found</title>
    <style>
        :root {
            --bg-1: #edf6ff;
            --bg-2: #dfeeff;
            --primary: #0b4f9c;
            --primary-strong: #083d7a;
            --primary-soft: #e2f0ff;
            --text: #0f172a;
            --muted: #475569;
            --card: rgba(255, 255, 255, 0.72);
            --border: rgba(11,79,156,0.12);
            --warn: #d97706;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(96,165,250,0.18), transparent 24%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .page-shell {
            width: min(980px, 100%);
            min-height: min(640px, calc(100vh - 48px));
            display: grid;
            place-items: center;
            position: relative;
        }

        .page-shell::before {
            content: "";
            position: absolute;
            inset: 28px 26px;
            background-image:
                linear-gradient(rgba(11,79,156,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(11,79,156,0.04) 1px, transparent 1px);
            background-size: 26px 26px;
            border-radius: 32px;
            mask-image: radial-gradient(circle at center, black 44%, transparent 100%);
        }

        .card {
            position: relative;
            width: min(860px, 100%);
            border-radius: 32px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 30px 70px rgba(11,79,156,0.12);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(96,165,250,0.08), transparent 38%, rgba(11,79,156,0.04));
            pointer-events: none;
        }

        .warning-bar {
            height: 6px;
            width: 100%;
            background: linear-gradient(90deg, #d97706, #f59e0b, #d97706);
        }

        .wrap {
            position: relative;
            z-index: 1;
            padding: 42px 46px 48px;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.20), rgba(251, 191, 36, 0.10));
            border: 1px solid rgba(217, 119, 6, 0.40);
            color: #9a5a00;
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 800;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
        }

        h1 {
            margin: 22px 0 0;
            font-size: clamp(4rem, 10vw, 10rem);
            line-height: 0.9;
            letter-spacing: -0.08em;
            font-weight: 900;
            color: #0f172a;
        }

        h2 {
            margin: 10px 0 0;
            font-size: clamp(1.5rem, 2.4vw, 2.5rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
            font-weight: 800;
            color: var(--text);
        }

        p {
            margin: 18px auto 0;
            max-width: 620px;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--muted);
        }

        .actions {
            margin-top: 32px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .primary,
        .secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            min-width: 220px;
            padding: 0.85rem 1.5rem;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: white;
            box-shadow: 0 12px 22px rgba(11,79,156,0.18);
        }

        .secondary {
            background: rgba(255,255,255,0.75);
            border: 1px solid rgba(15,23,42,0.08);
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
        }

        .primary:hover,
        .secondary:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 640px) {
            .wrap {
                padding: 32px 22px 36px;
            }

            .actions {
                flex-direction: column;
            }

            .primary,
            .secondary {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="card">

            <div class="wrap">

                <h1>404</h1>
                <h2>Page Not Found</h2>

                <p>
                    Sorry, the page you are looking for might have been moved, deleted, or is not available at the moment.
                    Please go back to the homepage or contact the admin if you need assistance.
                </p>

                <div class="actions">
                    <a href="../index.html" class="primary">Go Back to Homepage</a>
                    <a href="../pages/kontak.html" class="secondary">Contact Admin</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
