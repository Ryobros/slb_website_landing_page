<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program | SLB YAPMI Rancaekek</title>
    <meta name="description" content="Program pendidikan, lowongan pekerjaan, magang, dan vokasional di SLB YAPMI Rancaekek.">
    <link rel="shortcut icon" href="../assets/images/slb-logo.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        html, body, main, section, div, p, h1, h2, h3, h4, h5, h6, span, strong, a, button {
            font-family: "Lexend", "Segoe UI", sans-serif;
        }

        .filter-btn {
            border-radius: 9999px;
            border: 1px solid rgba(11, 79, 156, 0.14);
            background: #fff;
            color: var(--slb-muted);
            padding: 0.65rem 1rem;
            font-size: 0.82rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .filter-btn.active,
        .filter-btn:hover,
        .filter-btn:focus-visible {
            background: rgba(11, 79, 156, 0.08);
            color: var(--slb-primary);
            border-color: rgba(11, 79, 156, 0.18);
            box-shadow: 0 8px 20px rgba(11, 79, 156, 0.08);
        }

        .program-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(234,242,251,0.7));
            border: 1px solid rgba(11, 79, 156, 0.12);
            border-radius: 1.2rem;
            box-shadow: 0 12px 24px rgba(11, 79, 156, 0.06);
        }

        .program-card__badge {
            display: inline-flex;
            padding: 0.35rem 0.7rem;
            border-radius: 9999px;
            background: rgba(11, 79, 156, 0.08);
            color: var(--slb-primary);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .program-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            z-index: 50;
            padding: 1rem;
        }

        .program-modal.is-open {
            display: flex;
        }

        .program-modal__panel {
            width: min(100%, 760px);
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 1.25rem;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
            border: 1px solid rgba(15, 23, 42, 0.06);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="site-navbar"></div>

    <main>
        <section class="bg-section-light pt-16 pb-10 sm:pt-20">
            <div class="mx-auto max-w-6xl px-5 sm:px-8">
                <div class="reveal text-center">
                    <p class="text-xs font-semibold uppercase tracking-[.18em] text-[#0b4f9c]">
                        Program
                    </p>
                    <h1 class="mt-4 text-3xl font-black tracking-[-0.04em] text-slate-800 sm:text-4xl">
                        Program SLB YAPMI Rancaekek
                    </h1>
                    <p class="mx-auto mt-4 max-w-2xl text-sm leading-7 text-slate-600 sm:text-base">
                        Temukan program yang tersedia di SLB YAPMI Rancaekek untuk mendukung perkembangan, keterampilan, dan masa depan peserta didik.
                    </p>
                </div>
            </div>
        </section>

        <section class="pb-20 pt-6">
            <div class="mx-auto max-w-6xl px-5 sm:px-8">
                <div id="program-filters" class="mb-8 flex flex-wrap gap-3">
                    <button class="filter-btn active" data-filter="all" type="button">Semua</button>
                    <button class="filter-btn" data-filter="Pendidikan" type="button">Pendidikan</button>
                    <button class="filter-btn" data-filter="Lowongan Pekerjaan" type="button">Lowongan Pekerjaan</button>
                    <button class="filter-btn" data-filter="Magang" type="button">Magang</button>
                    <button class="filter-btn" data-filter="Vokasional" type="button">Vokasional</button>
                </div>

                <div id="program-list" class="grid gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <div id="program-modal" class="program-modal" aria-hidden="true">
        <div class="program-modal__panel" role="dialog" aria-modal="true" aria-labelledby="program-modal-title">
            <div class="border-b border-slate-200 px-6 py-4 sm:px-8">
                <div class="flex items-center justify-between gap-4">
                    <div class="text-xs font-semibold uppercase tracking-[0.2em] text-[#0b4f9c]">Program</div>
                    <button id="close-program-modal" type="button" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-slate-500 transition hover:border-slate-300 hover:text-slate-700" aria-label="Tutup modal">
                        <i data-lucide="x"></i>
                    </button>
                </div>
            </div>

            <div id="program-modal-content" class="px-6 py-6 sm:px-8"></div>
        </div>
    </div>

    <script src="../assets/js/script.js"></script>
    <script>
        const csvToRows = function (text) {
            const rows = [];
            let current = "";
            let row = [];
            let inQuotes = false;

            for (let i = 0; i < text.length; i += 1) {
                const char = text[i];

                if (char === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        current += '"';
                        i += 1;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(current.trim());
                    current = "";
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i + 1] === '\n') {
                        i += 1;
                    }

                    row.push(current.trim());
                    if (row.some(function (value) { return value !== ""; })) {
                        rows.push(row);
                    }
                    row = [];
                    current = "";
                } else {
                    current += char;
                }
            }

            if (current || row.length) {
                row.push(current.trim());
                if (row.some(function (value) { return value !== ""; })) {
                    rows.push(row);
                }
            }

            return rows;
        };

        const parseProgramsCsv = function (csvText) {
            const rows = csvToRows(csvText).filter(function (row) {
                return row.some(function (value) { return value && value.trim(); });
            });

            if (!rows.length) return [];

            const headers = rows[0].map(function (header) {
                return (header || '').trim();
            });

            return rows.slice(1).map(function (values) {
                const row = {};
                headers.forEach(function (header, index) {
                    row[header] = (values[index] ?? '').trim();
                });
                return row;
            });
        };

        const state = {
            filter: 'all',
            programs: []
        };

        const programList = document.getElementById('program-list');

        const escapeHtml = function (value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        const renderEmptyState = function (category) {
            const label = category === 'all' ? 'program' : category;
            programList.innerHTML = `
                <div class="md:col-span-2 xl:col-span-3">
                    <div class="rounded-3xl border border-dashed border-slate-300 bg-white p-10 text-center shadow-sm">
                        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-slate-100 text-[#0b4f9c]">
                            <i data-lucide="info"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800">Belum ada ${label}</h3>
                        <p class="mt-3 text-sm leading-7 text-slate-600">
                            Saat ini belum tersedia data untuk kategori ini. Silakan cek kembali lain waktu.
                        </p>
                    </div>
                </div>
            `;

            if (window.lucide) {
                lucide.createIcons();
            }
        };

        const formatList = function (value) {
            if (!value) return 'Belum ditentukan';
            return value.split(';').map(function (item) { return item.trim(); }).filter(Boolean).join('<br>');
        };

        const openProgramModal = function (program) {
            const modal = document.getElementById('program-modal');
            const modalContent = document.getElementById('program-modal-content');
            const email = (program.email || '').trim();
            const subject = encodeURIComponent('Lamaran program: ' + (program.title || 'Program'));
            const body = encodeURIComponent(
                'Halo,\n\nTerimakasih telah mendaftar untuk ' + (program.title || 'Program') + '.\n\nMohon agar melengkapi CV atau dokumen pendaftaran anda di sini.\n\nTerima kasih.'
            );
            const mailto = email ? 'mailto:' + email + '?subject=' + subject + '&body=' + body : '#';

            modalContent.innerHTML = `
                <div class="pb-5">
                    <span class="inline-flex rounded-full bg-[#0b4f9c]/10 px-3 py-1 text-[11px] font-bold uppercase tracking-[0.18em] text-[#0b4f9c]">${escapeHtml(program.category || 'Program')}</span>
                    <h2 id="program-modal-title" class="mt-4 text-2xl font-black text-slate-800 sm:text-3xl">${escapeHtml(program.detail_title || program.title || 'Judul Program')}</h2>
                    <p class="mt-3 text-sm leading-7 text-slate-600">${escapeHtml(program.detail_summary || program.description || 'Deskripsi program belum tersedia.')}</p>
                </div>

                <div class="grid gap-4 rounded-2xl bg-slate-50 p-4 text-sm text-slate-600 sm:grid-cols-2">
                    <div><span class="font-semibold text-slate-700">Lokasi:</span><br>${escapeHtml(program.location || 'Belum ditentukan')}</div>
                    <div><span class="font-semibold text-slate-700">Tanggal:</span><br>${escapeHtml(program.deadline || 'Belum ditentukan')}</div>
                    <div><span class="font-semibold text-slate-700">Status:</span><br>${escapeHtml(program.status || 'Belum ditentukan')}</div>
                    <div><span class="font-semibold text-slate-700">Email:</span><br>${escapeHtml(email || 'Belum ditentukan')}</div>
                </div>

                <div class="mt-6 space-y-5">
                    <div>
                        <h3 class="text-base font-bold text-slate-800">Deskripsi</h3>
                        <p class="mt-2 text-sm leading-7 text-slate-600">${escapeHtml(program.detail_description || program.description || 'Deskripsi program belum tersedia.')}</p>
                    </div>

                    <div>
                        <h3 class="text-base font-bold text-slate-800">Persyaratan</h3>
                        <div class="mt-2 text-sm leading-7 text-slate-600">${formatList(program.requirements)}</div>
                    </div>

                    <div>
                        <h3 class="text-base font-bold text-slate-800">Manfaat</h3>
                        <div class="mt-2 text-sm leading-7 text-slate-600">${formatList(program.benefits)}</div>
                    </div>
                </div>

                <div class="mt-8 flex flex-wrap items-center gap-3 border-t border-slate-200 pt-5">
                    <a
                        href="${mailto}"
                        class="inline-flex items-center justify-center rounded-xl bg-[#0b4f9c] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#083d7a] ${email ? '' : 'pointer-events-none opacity-50'}"
                        ${email ? '' : 'aria-disabled="true"'}
                    >
                        Lamar
                    </a>
                    <button id="close-program-modal-secondary" type="button" class="inline-flex items-center justify-center rounded-xl border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:text-slate-900">
                        Tutup
                    </button>
                </div>
            `;

            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
            document.getElementById('close-program-modal').focus();

            document.getElementById('close-program-modal').onclick = function () {
                modal.classList.remove('is-open');
                modal.setAttribute('aria-hidden', 'true');
            };

            document.getElementById('close-program-modal-secondary').onclick = function () {
                modal.classList.remove('is-open');
                modal.setAttribute('aria-hidden', 'true');
            };

            modal.onclick = function (event) {
                if (event.target === modal) {
                    modal.classList.remove('is-open');
                    modal.setAttribute('aria-hidden', 'true');
                }
            };
        };

        const renderPrograms = function () {
            const filtered = state.filter === 'all'
                ? state.programs
                : state.programs.filter(function (program) {
                    return program.category === state.filter;
                });

            if (!filtered.length) {
                renderEmptyState(state.filter);
                return;
            }

            programList.innerHTML = filtered.map(function (program) {
                return `
                    <article class="program-card p-6">
                        <span class="program-card__badge">${escapeHtml(program.category || 'Program')}</span>
                        <h3 class="mt-4 text-xl font-bold text-slate-800">${escapeHtml(program.title || 'Judul Program')}</h3>
                        <p class="mt-3 text-sm leading-7 text-slate-600">${escapeHtml(program.description || 'Deskripsi program belum tersedia.')}</p>

                        <ul class="mt-5 space-y-2 text-sm text-slate-600">
                            <li><strong class="font-semibold text-slate-700">Lokasi:</strong> ${escapeHtml(program.location || 'Belum ditentukan')}</li>
                            <li><strong class="font-semibold text-slate-700">Batas:</strong> ${escapeHtml(program.deadline || 'Belum ditentukan')}</li>
                            <li><strong class="font-semibold text-slate-700">Status:</strong> ${escapeHtml(program.status || 'Belum ditentukan')}</li>
                        </ul>

                        <button type="button" class="mt-6 rounded-md bg-[#0b4f9c] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[#083d7a]" data-program-id="${escapeHtml(program.id || '')}">
                            Lihat Detail
                        </button>
                    </article>
                `;
            }).join('');

            document.querySelectorAll('[data-program-id]').forEach(function (button) {
                button.addEventListener('click', function () {
                    const programId = button.getAttribute('data-program-id');
                    const program = state.programs.find(function (item) {
                        return (item.id || '').toString() === programId;
                    });

                    if (program) {
                        openProgramModal(program);
                    }
                });
            });
        };

        const initFilters = function () {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryFromUrl = urlParams.get('category');

            if (categoryFromUrl) {
                state.filter = categoryFromUrl;
            }

            document.querySelectorAll('.filter-btn').forEach(function (button) {
                const isActive = (button.dataset.filter || 'all') === state.filter;
                button.classList.toggle('active', isActive);

                button.addEventListener('click', function () {
                    document.querySelectorAll('.filter-btn').forEach(function (item) {
                        item.classList.toggle('active', item === button);
                    });

                    state.filter = button.dataset.filter || 'all';
                    const url = new URL(window.location.href);
                    if (state.filter === 'all') {
                        url.searchParams.delete('category');
                    } else {
                        url.searchParams.set('category', state.filter);
                    }
                    window.history.replaceState({}, '', url);
                    renderPrograms();
                });
            });
        };

        const fetchPrograms = async function () {
            try {
                const response = await fetch('./data/programs.csv', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('CSV program tidak ditemukan');
                }

                const csvText = await response.text();
                const parsedRows = parseProgramsCsv(csvText);
                state.programs = parsedRows;
                renderPrograms();
            } catch (error) {
                console.error('Gagal memuat data program:', error);
                renderEmptyState('all');
            }
        };

        initFilters();
        fetchPrograms();
    </script>
</body>
</html>
